# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

# Thin caller of the estate audit, which lives in hyperpolymath/cicd-suite as
# a reusable workflow and reports five component checks: governance,
# hygiene, manifests, languages, advisory. Do not copy the audit's steps in
# here. A copy freezes this repository at whatever cicd-suite commit its
# actions.lock happened to hold, and fixes made upstream never arrive.
#
# PERIODIC tier under the standards CI signal discipline: push to main,
# weekly, or on demand; never on pull_request, and never a required check
# (standards config/rulesets/gates.json).
#
# ⚠ DE-ONBOARDED from actions.lock, deliberately, like the secret-scanner
# caller. A reusable workflow onboarded cross-repo startup-fails with zero
# jobs under sha_pinning_required (see the header of cicd-suite's
# main-estate-audit.yml). Do not run a full-directory `gh actions-lock` that
# re-onboards this file. If one does, cicd-suite/scripts/deonboard-estate-audit.sh
# reverses it.

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '41 4 * * 1'   # weekly, Monday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estate:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@b17ec1af1bbf097d77a58ac3363c4cf5db4d7f4a # cicd-suite main, 2026-10-19 (#55)
    with:
      # audits/assail-classifications.a2ml is panic-attack's suppression
      # registry, read from that fixed path; it is not a DEED manifest. A list
      # replaces the validator's defaults, so they are repeated here first.
      manifest-deed-paths-ignore: |
        vendor/
        vendored/
        verified-container-spec/
        .audittraining/
        integration/fixtures/
        test/fixtures/
        tests/fixtures/
        audits/assail-classifications.a2ml
