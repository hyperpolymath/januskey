name: Agda proofs
# First green run 2026-10-13, Agda 2.6.4.3 (PR #150). Pattern: choreographic-types /
# residual-evidence-types (pinned Debian prover, sibling fetched by commit).
# Checks verification/proofs/agda/Reversibility.agda under the kernel flags
# and refuses the fixtures under tests/reject-agda. Local run: just test-agda.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  proofs:
    name: Reversibility as a grade (Loss instance), expected rejections
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # trixie-slim, resolved 2026-10-13; re-pin deliberately, like the prover below.
    container: debian:trixie-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    env:
      # PROOF-POLICY §6 deviation D-1 (PROOF-NEEDS.adoc, "Toolchain deviations"):
      # the prover comes from Debian's archive, not a Guix manifest or the repo's
      # own container. These are the archive's SHA-256 for the two packages that
      # hold it: the binary, and the library that ships Agda.Primitive.
      AGDA_VERSION: 2.6.4.3-1+b2
      AGDA_BIN_SHA256: 31052ce0b53e9cf061c9386a0416525318a66bbd1bfaa4bef93f0f43dec8b748
      LIBGHC_AGDA_DEV_SHA256: 58d8551bec42796d2aa9f6baaa253eb23095e118869fe235be6d4aa2e130ce60
    steps:
      - name: Install the pinned prover (digest-checked, deviation D-1)
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git
          cd "$RUNNER_TEMP"
          apt-get download "agda-bin=${AGDA_VERSION}" "libghc-agda-dev=${AGDA_VERSION}"
          printf '%s  %s\n' \
            "${AGDA_BIN_SHA256}" "agda-bin_${AGDA_VERSION}_amd64.deb" \
            "${LIBGHC_AGDA_DEV_SHA256}" "libghc-agda-dev_${AGDA_VERSION}_amd64.deb" \
            | sha256sum -c -
          apt-get install --no-install-recommends -y \
            "./agda-bin_${AGDA_VERSION}_amd64.deb" "./libghc-agda-dev_${AGDA_VERSION}_amd64.deb"
          rm ./*.deb
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Proofs, sibling pin, expected rejections
        run: bash scripts/check-agda.sh
  recheck:
    # PROOF-POLICY §2 recheck legs: the Rocq and Lean re-proofs of the Agda
    # theorems, with their expected-rejection fixtures. Local run: just test-recheck.
    name: Rocq and Lean recheck legs, expected rejections
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # PROOF-POLICY §6 deviations D-2 (Rocq, from Ubuntu's archive) and D-3
      # (Lean, from the upstream release tarball); PROOF-NEEDS.adoc, "Toolchain
      # deviations". The Rocq digests are the archive's SHA-256 for the driver,
      # the kernel library and the library that ships Init.
      COQ_VERSION: 8.18.0+dfsg-1build2
      COQ_SHA256: 22897a17a75d8930276f5eedd5cd29ac940f1ab4d4661b6a49ccc63577e54d3b
      LIBCOQ_CORE_OCAML_SHA256: 027c8fb39db20de4910f8a75e0b9a32c0fbc27c6f532375ed7604757f71c12a9
      LIBCOQ_STDLIB_SHA256: af139bb3af8c71b5e991944a61eef5bba28038a715f71146fa046241bb614b23
      LEAN_VERSION: 4.35.0
      LEAN_SHA256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d
    steps:
      - name: Install the pinned provers (digest-checked, deviations D-2 and D-3)
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
          cd "$RUNNER_TEMP"
          apt-get download "coq=${COQ_VERSION}" "libcoq-core-ocaml=${COQ_VERSION}" \
            "libcoq-stdlib=${COQ_VERSION}"
          printf '%s  %s\n' \
            "${COQ_SHA256}" "coq_${COQ_VERSION}_amd64.deb" \
            "${LIBCOQ_CORE_OCAML_SHA256}" "libcoq-core-ocaml_${COQ_VERSION}_amd64.deb" \
            "${LIBCOQ_STDLIB_SHA256}" "libcoq-stdlib_${COQ_VERSION}_amd64.deb" \
            | sha256sum -c -
          sudo apt-get install --no-install-recommends -y "./coq_${COQ_VERSION}_amd64.deb" \
            "./libcoq-core-ocaml_${COQ_VERSION}_amd64.deb" "./libcoq-stdlib_${COQ_VERSION}_amd64.deb"
          rm ./*.deb
          curl --proto '=https' --tlsv1.2 -sSfL -o lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          echo "${LEAN_SHA256}  lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf lean.tar.zst -C "$RUNNER_TEMP/lean"
          rm lean.tar.zst
          echo "$RUNNER_TEMP/lean/lean-${LEAN_VERSION}-linux/bin" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the checked prover versions
        run: |
          test "$(coqc --version | head -1)" = 'The Coq Proof Assistant, version 8.18.0'
          lean --version | grep -q "^Lean (version ${LEAN_VERSION}, "
          lake --version | grep -qF "(Lean version ${LEAN_VERSION})"
      - name: Recheck legs, no axioms, expected rejections
        run: bash scripts/check-recheck.sh
  receipt:
    # PROOF-POLICY §8.5.1 and §8.5.3: the machine-readable proof receipt
    # (verification/receipts/januskey_praxis.deed) is what the ledgers and git
    # give, the pinned standards reader derives every grade from it, and the
    # commits it names hold what it says. Local run: just test-receipt.
    name: Proof receipt, derived grades, git checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUN_VERSION: 1.4.4
      BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
    steps:
      - name: Install the pinned Bun
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  bun.zip" | sha256sum -c -
          unzip -q bun.zip -d "$RUNNER_TEMP"
          rm bun.zip
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Checkout (full history; the git checks refuse a shallow clone)
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the checked Bun version
        run: test "$(bun --version)" = "${BUN_VERSION}"
      - name: Receipt, reader, git checks, freshness
        run: |
          bash scripts/fetch-siblings.sh
          bash scripts/proof-receipt.sh --check
