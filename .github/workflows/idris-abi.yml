# Checks the Idris2 ABI tree invariants (scripts/check-abi-tree.sh) and
# typechecks the ABI package (src/abi/januskey-abi.ipkg).
# NOT yet a required check: the typecheck step is expected to be red until the
# follow-up commits land (Foreign.idr still carries the RSR template FFI, and
# Types.idr has known errors); the tree-invariant step must be green now.
name: Idris ABI typecheck
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  idris-abi:
    name: "idris-abi"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: ABI tree invariants
        run: bash scripts/check-abi-tree.sh
      - name: ABI <-> header <-> Zig agreement
        run: bash scripts/check-abi-layout.sh
      - name: Typecheck ABI package
        run: |
          idris2 --version
          idris2 --typecheck src/abi/januskey-abi.ipkg
      - name: Expected rejections
        run: bash scripts/check-idris-reject.sh
