# SPDX-License-Identifier: MPL-2.0
# Typechecks the Idris2 ABI package (src/idris-abi/januskey-abi.ipkg).
# NOT a required check: it is expected to be red until J1-3 fixes the known
# errors in src/abi (Types.idr, and the Januskey/JanusKey module-name casing).
name: Idris ABI typecheck
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  idris-abi:
    name: "idris-abi (expected red until J1-3)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Typecheck ABI package
        run: |
          idris2 --version
          idris2 --typecheck src/idris-abi/januskey-abi.ipkg
