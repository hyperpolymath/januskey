# This workflow is managed by gh actions-lock.
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Weekly, so a new RustSec advisory against an unchanged Cargo.lock is still
  # caught (the scheduled cargo-audit.yml was folded into this workflow).
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66 # standards main, 2026-10-19
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # Replaces the retired cargo-audit.yml (standards CI regularisation spec:
      # fold the audit into rust-ci through enable_audit).
      enable_audit: true
